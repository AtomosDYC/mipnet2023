<div class="card-container">
    <div class="card-header-wrapper col-lg-12">
        <h3 class="card-title col-md-10"> {{ customMsgService.translate('mantenimientoTemporadaBase') }} </h3>
        <div class="card-buttons col-md-2 right">
            <kendo-buttongroup selection="single">
                <button
                    kendoButton
                    [toggleable]="true"
                    [selected]="true"
                    (click)="OnNuevoTemporadabase()"
                >
                    {{ customMsgService.translate('MantNuevo') }}
                </button>
            </kendo-buttongroup>
        </div>  
        <span></span>
    </div>
    
    <form class="k-form" [formGroup]="Form" (keyup.enter)="SubmitSearch(Form.value)">
        <kendo-textbox
                [placeholder]="customMsgService.translate('gridSearch')"
                kendoTextBox
                [clearButton]="true"
                class="col-md-12"
                formControlName="txtSearch"
                #txtSearch
            >
            </kendo-textbox>
    </form>

    <div class="card-component">
        <kendo-grid [data]="data$ | async"
        
        kendoGridSelectBy="temp02llave"
        [(selectedKeys)]="mySelection"
       
        (pageChange)="pageChange($event)"
        [pageSize]="requeststate.take"
        [skip]="requeststate.skip"
        [pageable]="true"
        [loading]="loadGrid"
        [sortable]="true"
        [sort]="sort"
        (sortChange)="sortChange($event)"
        [selectable]="{ checkboxOnly: true, mode: 'multiple' }"
        >
        <ng-template kendoGridToolbarTemplate>
            
            <button type="button" [svgIcon]="svgpdf" kendoButton (click)="onactivateTemporadabase()">{{ customMsgService.translate('MantActivar') }}</button>
            <button type="button" [svgIcon]="svgpdf" kendoButton (click)="OndisableTemporadabase()">{{ customMsgService.translate('MantDesactivar') }}</button>
            <button kendoButton kendoGridExcelCommand type="button" [svgIcon]="svgpdf">
                {{ customMsgService.translate('MantExpExcel') }}
            </button>
            <button kendoButton kendoGridPDFCommand [svgIcon]="svgpdf">{{ customMsgService.translate('MantExpPDF') }}</button>
        </ng-template>


            <kendo-grid-checkbox-column
                [width]="45"
                [headerClass]="{ 'text-center': true }"
                [class]="{ 'text-center': true }"
                [resizable]="false"
                [columnMenu]="false"
                [showSelectAll]="true">
            </kendo-grid-checkbox-column>
            <kendo-grid-command-column title="" [width]="110">
                <ng-template kendoGridCellTemplate let-dataItem="dataItem">
                    <button
                    kendoButton
                    iconClass="fa fa-pencil"
                    title="{{ customMsgService.translate('Edit') }}"
                    
                    (click)="OnEditarTemporadabase(dataItem.temp02llave)"
                  ></button>
                  <button
                    kendoButton
                    iconClass="fa-solid fa-trash-can"
                    title="{{ customMsgService.translate('Delete') }}"
                    (click)="OnEliminarTemporadabase(dataItem.temp02llave, dataItem.temp02activo)"
                  ></button>
                </ng-template>
              </kendo-grid-command-column>
            <kendo-grid-column field="temp02nombre" title="{{ customMsgService.translate('nombre') }}"> </kendo-grid-column>
            <kendo-grid-column field="temp02descripcion" title="{{ customMsgService.translate('descripcion') }}"> </kendo-grid-column>
            <kendo-grid-column
                field="temp02activo"
                title="{{ customMsgService.translate('estado') }}"
                [width]="100"
                [class]="{ 'text-center': true }"
                [resizable]="false"
                filter="boolean"
                >
                <ng-template kendoGridCellTemplate let-dataItem>
                    <span
                    *ngIf="dataItem.temp02activo === 1"
                    class="badge badge-success"
                    >{{ customMsgService.translate('Activo') }}</span
                    >
                    <span
                    *ngIf="dataItem.temp02activo != 1"
                    class="badge badge-danger"
                    >{{ customMsgService.translate('Desactivado') }}</span
                    >
                </ng-template>
                </kendo-grid-column>    
                
        </kendo-grid>
    </div>

</div>
